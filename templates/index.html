<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>

    <h1>To-Do List</h1>

    <form method="POST" action="/submittodoitem">

        <label for="item_name">Item Name:</label>
        <input type="text" id="item_name" name="item_name" required>

	<br><br>

	<label for="item_id">Item ID:</label>
	<input type="text" id="item_id" name="item_id" required>
        <br><br>

	<label for="item_id">Item UUID:</label>
	<input type="text" id="item_uuid" name="item_uuid" required>

	<br><br>

	<label for="item_hash">Item Hash:</label>
	<input type="text" id="item_hash" name="item_hash" required>

	<br><br>

        <label for="item_description">Item Description:</label>
        <textarea id="item_description" name="item_description" required></textarea>

        <br><br>

        <button type="submit">Add Item</button>

    </form>

</body>
</html>
